name: Build ShareX (fork)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

jobs:
  build:
    name: Build
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props
      FFMPEG_VERSION: "9.0"

    outputs:
      APP_VERSION: ${{ env.APP_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set APP_VERSION
        shell: pwsh
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>'
          $match = [regex]::Match($content, $pattern)
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            # Fork build suffix so fork binaries are distinguishable from upstream
            $version = "$version-jxl"
          }
          echo $version
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: dotnet restore --runtime "win-x64" "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        run: dotnet build --no-restore --configuration "Release" -p:Platform="x64" --self-contained true /m "${{ env.SOLUTION_FILE_PATH }}"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $downloadUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${{ env.FFMPEG_VERSION }}-latest-win64-gpl-${{ env.FFMPEG_VERSION }}.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $ffmpegPath = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $ffmpegPath) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }
          $destinationPath = "${{ github.workspace }}\ShareX\bin\Release\win-x64\ffmpeg.exe"
          Copy-Item -LiteralPath $ffmpegPath.FullName -Destination $destinationPath -Force

      - name: Setup
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        shell: pwsh
        run: |
          & "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job "Release" -platform "x64"

      - name: Upload artifact (Setup)
        uses: actions/upload-artifact@v7
        with:
          name: Setup-x64
          path: Output\ShareX-*-setup-x64.exe

      - name: Upload artifact (Portable)
        uses: actions/upload-artifact@v7
        with:
          name: Portable-x64
          path: Output\ShareX-*-portable-x64.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download artifact (Setup)
        uses: actions/download-artifact@v8
        with:
          name: Setup-x64
          path: Output

      - name: Download artifact (Portable)
        uses: actions/download-artifact@v8
        with:
          name: Portable-x64
          path: Output

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ShareX ${{ needs.build.outputs.APP_VERSION }} (jxl-avif fork)
          draft: false
          prerelease: false
          files: |
            Output/*.exe
            Output/*.zip
